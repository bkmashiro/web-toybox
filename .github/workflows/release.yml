name: Release npm packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish package versions that do not exist on npm
        type: boolean
        required: true
        default: false
  push:
    tags:
      - 'release-*'

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm size
      - name: Plan package releases
        run: node scripts/release-packages.mjs
      - name: Publish missing versions
        if: startsWith(github.ref, 'refs/tags/release-') || inputs.publish == true
        run: node scripts/release-packages.mjs --publish
