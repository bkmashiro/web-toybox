<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E7%8E%A9%3C/text%3E%3C/svg%3E" />
  <meta name="description" content="一只零依赖、可以甩和接的网页剑玉。" />
  <title>剑玉 · 旧玩具箱</title>
</head>
<body>
  <header class="toy-header">
    <a href="../../">← 回玩具箱</a>
    <span>NO. 002 · KENDAMA</span>
  </header>
  <main class="toy-layout">
    <section class="toy-copy">
      <p class="eyebrow">木头 · 棉线 · 重力</p>
      <h1>把球<br /><em>接回来。</em></h1>
      <p class="lede">拖住剑身快速画圈，再放慢手腕，让木球落进大皿或小皿。困难模式里，绳子拴在会旋转的球洞上；想入玉，位置、速度和洞口角度都要对。</p>
      <div class="controls">
        <button id="sound-unlock" class="primary" type="button">点一下打开声音</button>
        <button id="release" type="button">放球</button>
        <button id="mode" type="button" aria-pressed="true">困难模式：开</button>
        <button id="reset" type="button">重新来</button>
        <label class="volume-control" for="volume">
          <span>音量 <output id="volume-output">75%</output></span>
          <input id="volume" type="range" min="0" max="100" step="5" value="75" aria-label="木头声音量" />
        </label>
      </div>
      <dl class="telemetry">
        <div><dt>现在</dt><dd><output id="catch-state">还在空中</output></dd></div>
        <div><dt>球速</dt><dd><output id="ball-speed">0 px/s</output></dd></div>
        <div><dt>球洞</dt><dd><output id="hole-angle">0°</output></dd></div>
      </dl>
      <code>npm i @web-toybox/kendama</code>
    </section>
    <section class="stage-frame" aria-label="剑玉试玩区"><div id="stage"></div></section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
