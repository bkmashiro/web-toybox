<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E7%8E%A9%3C/text%3E%3C/svg%3E" /><meta name="description" content="滚珠迷宫网页小玩具。" /><title>滚珠迷宫 · 旧玩具箱</title></head><body><header class="toy-header"><a href="../../">← 回玩具箱</a><span>NO. 009 · MARBLE MAZE</span></header><main class="toy-layout"><section class="toy-copy"><p class="eyebrow">木盘 · 钢珠 · 陷阱孔</p><h1>慢慢倾斜<br /><em>别掉下去。</em></h1><p class="lede">按住木盘往任意方向拖动，控制钢珠穿过隔板。避开黑洞，把它送进写着“终”的铜圈。</p><div class="controls"><button id="sound-unlock" class="primary" type="button">点一下打开声音</button><button id="reset" type="button">重新开盘</button><label class="volume-control" for="volume"><span>音量 <output id="volume-output">75%</output></span><input id="volume" type="range" min="0" max="100" step="5" value="75" aria-label="滚珠迷宫音量" /></label></div><dl class="telemetry"><div><dt>用时</dt><dd><output id="metric">0.0 秒</output></dd></div><div><dt>状态</dt><dd><output id="status">找出口</output></dd></div></dl><code>npm i @web-toybox/marble-maze</code></section><section class="stage-frame amber" aria-label="滚珠迷宫试玩区"><div id="stage"></div></section></main><script type="module" src="./main.ts"></script></body></html>
