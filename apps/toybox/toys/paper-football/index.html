<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E7%8E%A9%3C/text%3E%3C/svg%3E" /><meta name="description" content="桌上纸足球网页小玩具。" /><title>桌上纸足球 · 旧玩具箱</title></head><body><header class="toy-header"><a href="../../">← 回玩具箱</a><span>NO. 011 · PAPER FOOTBALL</span></header><main class="toy-layout"><section class="toy-copy"><p class="eyebrow">折纸 · 绒布桌 · 弹射</p><h1>向后拉开<br /><em>一指射门。</em></h1><p class="lede">按住三角纸片向后拉，松手弹向上方球门。可以借左右边框反弹，空格键会直接来一脚。</p><div class="controls"><button id="sound-unlock" class="primary" type="button">点一下打开声音</button><button id="kick" type="button">直射</button><button id="reset" type="button">重新计分</button><label class="volume-control" for="volume"><span>音量 <output id="volume-output">75%</output></span><input id="volume" type="range" min="0" max="100" step="5" value="75" aria-label="桌上纸足球音量" /></label></div><dl class="telemetry"><div><dt>进球</dt><dd><output id="metric">0 球</output></dd></div><div><dt>射门</dt><dd><output id="status">0 次</output></dd></div></dl><code>npm i @web-toybox/paper-football</code></section><section class="stage-frame green" aria-label="桌上纸足球试玩区"><div id="stage"></div></section></main><script type="module" src="./main.ts"></script></body></html>
