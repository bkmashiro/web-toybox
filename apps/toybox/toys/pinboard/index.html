<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E7%8E%A9%3C/text%3E%3C/svg%3E" /><meta name="description" content="弹珠钉板网页小玩具。" /><title>弹珠钉板 · 旧玩具箱</title></head><body><header class="toy-header"><a href="../../">← 回玩具箱</a><span>NO. 010 · PINBOARD</span></header><main class="toy-layout"><section class="toy-copy"><p class="eyebrow">玻璃珠 · 铜钉 · 五格计分</p><h1>挑一条路<br /><em>让它自己走。</em></h1><p class="lede">在顶端左右选好位置，松手放下玻璃珠。每次碰钉都会改道，中间红格值五十分。</p><div class="controls"><button id="sound-unlock" class="primary" type="button">点一下打开声音</button><button id="drop" type="button">放一颗</button><button id="reset" type="button">清零</button><label class="volume-control" for="volume"><span>音量 <output id="volume-output">75%</output></span><input id="volume" type="range" min="0" max="100" step="5" value="75" aria-label="弹珠钉板音量" /></label></div><dl class="telemetry"><div><dt>得分</dt><dd><output id="metric">0 分</output></dd></div><div><dt>落珠</dt><dd><output id="status">0 颗</output></dd></div></dl><code>npm i @web-toybox/pinboard</code></section><section class="stage-frame blue" aria-label="弹珠钉板试玩区"><div id="stage"></div></section></main><script type="module" src="./main.ts"></script></body></html>
