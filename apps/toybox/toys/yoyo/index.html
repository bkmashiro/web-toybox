<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E7%8E%A9%3C/text%3E%3C/svg%3E" />
  <meta name="description" content="会睡眠、回线和鸣响的网页悠悠球。" />
  <title>悠悠球 · 旧玩具箱</title>
</head>
<body>
  <header class="toy-header"><a href="../../">← 回玩具箱</a><span>NO. 003 · YO-YO</span></header>
  <main class="toy-layout">
    <section class="toy-copy">
      <p class="eyebrow">圆盘 · 棉线 · 自旋</p>
      <h1>放下去<br /><em>再回来。</em></h1>
      <p class="lede">拖住上方的手指甩动。圆盘落到绳端后会把速度存进自旋；稳住它进入睡眠，再点收线，让转动沿着绳子爬回掌心。</p>
      <div class="controls">
        <button id="sound-unlock" class="primary" type="button">点一下打开声音</button>
        <button id="return" type="button">收线</button>
        <button id="release" type="button">重新放线</button>
        <button id="reset" type="button">重新来</button>
        <label class="volume-control" for="volume">
          <span>音量 <output id="volume-output">75%</output></span>
          <input id="volume" type="range" min="0" max="100" step="5" value="75" aria-label="转动声音量" />
        </label>
      </div>
      <dl class="telemetry">
        <div><dt>状态</dt><dd><output id="phase">下落</output></dd></div>
        <div><dt>转速</dt><dd><output id="spin">0 rad/s</output></dd></div>
        <div><dt>线长</dt><dd><output id="length">0 px</output></dd></div>
      </dl>
      <code>npm i @web-toybox/yoyo</code>
    </section>
    <section class="stage-frame blue" aria-label="悠悠球试玩区"><div id="stage"></div></section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
