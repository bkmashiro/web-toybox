<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E7%8E%A9%3C/text%3E%3C/svg%3E" />
  <meta name="description" content="孔明棋网页小玩具。" />
  <title>孔明棋 · 旧玩具箱</title>
</head>
<body>
  <header class="toy-header"><a href="../../">← 回玩具箱</a><span>NO. 008 · PEG SOLITAIRE</span></header>
  <main class="toy-layout">
    <section class="toy-copy">
      <p class="eyebrow">跳棋 · 空穴 · 单人残局</p>
      <h1>跳过一颗<br /><em>只留一颗。</em></h1>
      <p class="lede">先选一颗棋子，再点隔着一颗棋子的空穴。被跨过的棋子会离开木盘；没有合法跳法时结束。</p>
      <div class="controls">
        <button id="sound-unlock" class="primary" type="button">点一下打开声音</button>
        <button id="reset" type="button">重新摆棋</button>
        <label class="volume-control" for="volume"><span>音量 <output id="volume-output">75%</output></span><input id="volume" type="range" min="0" max="100" step="5" value="75" aria-label="孔明棋音量" /></label>
      </div>
      <dl class="telemetry">
        <div><dt>剩余</dt><dd><output id="metric">32 颗</output></dd></div>
        <div><dt>状态</dt><dd><output id="status">进行中</output></dd></div>
      </dl>
      <code>npm i @web-toybox/peg-solitaire</code>
    </section>
    <section class="stage-frame green" aria-label="孔明棋试玩区"><div id="stage"></div></section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
