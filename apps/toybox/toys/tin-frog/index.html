<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E7%8E%A9%3C/text%3E%3C/svg%3E" />
  <meta name="description" content="上发条后会真实起跳的网页铁皮青蛙。" />
  <title>铁皮青蛙 · 旧玩具箱</title>
</head>
<body>
  <header class="toy-header"><a href="../../">← 回到旧玩具箱</a><span>CATALOGUE № 004</span></header>
  <main class="toy-layout">
    <section class="toy-copy">
      <span class="label">发条玩具</span>
      <h1>铁皮青蛙</h1>
      <p class="roman">WIND-UP TIN FROG</p>
      <p class="lede">按住上发条，松手后弹簧会经过小凸轮传给后腿。能量不是无限的，每跳一次都会少一点。</p>
      <div class="controls">
        <button id="sound-unlock" class="primary" type="button">点一下打开声音</button>
        <button id="wind" type="button">按住上发条</button>
        <button id="reset" type="button">摆回起点</button>
        <label class="volume-control" for="volume">
          <span>音量 <output id="volume-output">75%</output></span>
          <input id="volume" type="range" min="0" max="100" step="5" value="75" aria-label="铁皮声音量" />
        </label>
      </div>
      <dl class="telemetry">
        <div><dt>发条</dt><dd id="energy">0%</dd></div>
        <div><dt>状态</dt><dd id="phase">待机</dd></div>
        <div><dt>跳数</dt><dd id="hops">0</dd></div>
      </dl>
      <code>npm i @web-toybox/tin-frog</code>
    </section>
    <section class="stage-frame green" id="stage"></section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
