<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E7%8E%A9%3C/text%3E%3C/svg%3E" />
  <meta name="description" content="七巧板网页小玩具。" />
  <title>七巧板 · 旧玩具箱</title>
</head>
<body>
  <header class="toy-header"><a href="../../">← 回玩具箱</a><span>NO. 006 · TANGRAM</span></header>
  <main class="toy-layout">
    <section class="toy-copy">
      <p class="eyebrow">七片 · 多边形 · 自由拼</p>
      <h1>拆开一方天地<br /><em>再拼出万物。</em></h1>
      <p class="lede">拖动七块木片自由组合。双击拼片，或选中后按空格，每次旋转四十五度。虚线方框只是尺寸参照，没有唯一答案。</p>
      <div class="controls">
        <button id="sound-unlock" class="primary" type="button">点一下打开声音</button>
        <button id="reset" type="button">重摆七片</button>
        <label class="volume-control" for="volume"><span>音量 <output id="volume-output">75%</output></span><input id="volume" type="range" min="0" max="100" step="5" value="75" aria-label="七巧板音量" /></label>
      </div>
      <dl class="telemetry">
        <div><dt>拼片</dt><dd><output id="metric">7 块</output></dd></div>
        <div><dt>玩法</dt><dd><output id="status">自由拼图</output></dd></div>
      </dl>
      <code>npm i @web-toybox/tangram</code>
    </section>
    <section class="stage-frame amber" aria-label="七巧板试玩区"><div id="stage"></div></section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
